---
deployment:
  tasks:
    - export DEPLOYPATH=/home/xpresvfp/public_html/
    - /bin/cp -R .htaccess $DEPLOYPATH
    - /bin/cp -R robots.txt $DEPLOYPATH
    - /bin/cp -R sitemap.xml $DEPLOYPATH
    - /bin/cp -R *.html $DEPLOYPATH
    - /bin/cp -R assets/ $DEPLOYPATH
    - /bin/cp -R 404.html $DEPLOYPATH
    - /bin/cp -R mail.php $DEPLOYPATH
